<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Expense Tracker</h1>
    <p class="subtitle">Keep track of where your money goes</p>
  </header>

  <main class="container">
    <!-- Summary cards -->
    <section class="summary" aria-label="Account summary">
      <div class="card balance">
        <span class="label">Current Balance</span>
        <span class="value" id="balance">₹0.00</span>
      </div>
      <div class="card income">
        <span class="label">Total Income</span>
        <span class="value" id="total-income">₹0.00</span>
      </div>
      <div class="card expense">
        <span class="label">Total Expenses</span>
        <span class="value" id="total-expense">₹0.00</span>
      </div>
    </section>

        <div class="layout">
      <!-- Add / edit form -->
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Add Transaction</h2>

        <form id="transaction-form" novalidate>
          <fieldset class="field">
            <legend>Type</legend>
            <div class="toggle-group">
              <input type="radio" name="type" id="type-expense" value="expense" checked />
              <label for="type-expense">Expense</label>
              <input type="radio" name="type" id="type-income" value="income" />
              <label for="type-income">Income</label>
            </div>
          </fieldset>

          <div class="field">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" step="0.01" min="0" inputmode="decimal" placeholder="0.00" />
            <small class="error" id="amount-error"></small>
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category"></select>
            <small class="error" id="category-error"></small>
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" />
            <small class="error" id="date-error"></small>
          </div>

          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" maxlength="100" placeholder="e.g. Groceries" />
            <small class="error" id="description-error"></small>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn primary">Add Transaction</button>
            <button type="button" id="cancel-edit" class="btn secondary hidden">Cancel</button>
          </div>
        </form>
      </section>

           <!-- Transaction list -->
      <section class="panel" aria-labelledby="list-title">
        <h2 id="list-title">Transactions</h2>

        <div class="filters">
          <select id="filter-type" aria-label="Filter by type">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filter-category" aria-label="Filter by category"></select>
          <select id="filter-month" aria-label="Filter by month"></select>
          <button type="button" id="clear-filters" class="btn link">Clear</button>
        </div>

        <p class="filter-info" id="filter-info"></p>
        <ul id="transaction-list" class="transaction-list"></ul>
        <p id="empty-state" class="empty"></p>
      </section>

    </div>
        <div class="layout">
      <!-- Monthly summary (bonus) -->
      <section class="panel" aria-labelledby="monthly-title">
        <h2 id="monthly-title">Monthly Summary</h2>
        <div class="table-wrap">
          <table id="monthly-table">
            <thead>
              <tr>
                <th>Month</th>
                <th>Income</th>
                <th>Expenses</th>
                <th>Net</th>
              </tr>
            </thead>
            <tbody id="monthly-summary-body"></tbody>
          </table>
        </div>
        <p id="monthly-empty" class="empty">No data yet.</p>
      </section>

      <!-- Category chart (bonus) -->
      <section class="panel" aria-labelledby="chart-title">
        <h2 id="chart-title">Expenses by Category</h2>
        <div id="category-chart" class="chart"></div>
      </section>
    </div>

  </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    
  <script src="script.js"></script>
</body>
</html>
